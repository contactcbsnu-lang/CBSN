    <script>
        // --- Configuration ---
        const YOUTUBE_API_KEY = "AIzaSyB5e1HpwuO4_4mx51JvMtx2xS5qB5dqPCU";

        // --- State Management ---
        let state = {
            currentView: 'dashboard',
            profile: {
                name: '', dob: '', age: null, qualification: '', targetExam: '', status: '', hours: '', attemptDate: '', totalDays: 0
            },
            onboardingStep: 1,
            messages: [{ role: 'ai', content: "Welcome to Rithiksha AI. I'm your academic architect. Let's start with the basics: What is your full name?" }],
            showSummary: false,
            roadmapData: [],
            selectedDay: 1,
            dayVideos: {},
            isFetchingVideos: false
        };

        const navConfig = [
            { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
            { id: 'ai', label: 'Rithiksha AI', icon: 'sparkles' },
            { id: 'helper', label: 'Textbook Helper', icon: 'book-open' },
            { id: 'vidya', label: 'Vidya AI Path', icon: 'zap' },
            { id: 'cbsnu', label: 'CBSNU Exams', icon: 'graduation-cap' }
        ];

        // --- Core Functions ---

        function navigateTo(view) {
            state.currentView = view;
            render();
        }

        async function fetchWithRetry(url, options = {}, retries = 5) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return await response.json();
                    if (response.status !== 429 && response.status < 500) break;
                } catch (e) {
                    if (i === retries - 1) throw e;
                }
                await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
            }
            throw new Error("API Limit reached");
        }

        function calculateAge(dob) {
            const today = new Date();
            const birthDate = new Date(dob);
            let age = today.getFullYear() - birthDate.getFullYear();
            return age;
        }

        function calculateDays(target) {
            const today = new Date();
            const examDate = new Date(target);
            const diffTime = Math.abs(examDate - today);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function handleOnboarding(input) {
            if (!input && state.onboardingStep !== 5) return;
            state.messages.push({ role: 'user', content: input });
            
            let aiResponse = "";
            let nextStep = state.onboardingStep;

            switch(state.onboardingStep) {
                case 1: 
                    state.profile.name = input;
                    aiResponse = `Nice to meet you, ${input}! What is your Date of Birth? (YYYY-MM-DD)`;
                    nextStep = 2;
                    break;
                case 2:
                    state.profile.dob = input;
                    state.profile.age = calculateAge(input);
                    aiResponse = `Got it. You are ${state.profile.age} years old. What is your highest educational qualification?`;
                    nextStep = 3;
                    break;
                case 3:
                    state.profile.qualification = input;
                    aiResponse = `For which exam are you preparing? (e.g. CBSNU, GRE, UPSC)`;
                    nextStep = 4;
                    break;
                case 4:
                    state.profile.targetExam = input;
                    aiResponse = `Are you a working professional or a full-time student?`;
                    nextStep = 5;
                    break;
                case 5:
                    state.profile.status = input;
                    aiResponse = `How many hours per day can you dedicate to study?`;
                    nextStep = 6;
                    break;
                case 6:
                    state.profile.hours = input;
                    aiResponse = `When is your target attempt date? (YYYY-MM-DD)`;
                    nextStep = 7;
                    break;
                case 7:
                    state.profile.attemptDate = input;
                    state.profile.totalDays = calculateDays(input);
                    aiResponse = `Perfect. You have ${state.profile.totalDays} days left. Generating your blueprint now...`;
                    nextStep = 8;
                    setTimeout(() => { state.showSummary = true; render(); }, 1500);
                    break;
            }
            
            state.onboardingStep = nextStep;
            state.messages.push({ role: 'ai', content: aiResponse });
            render();
        }

        async function fetchYouTubeVideos(day) {
            if (state.dayVideos[day]) return;
            state.isFetchingVideos = true;
            render();

            const query = encodeURIComponent(`${state.profile.targetExam} ${state.roadmapData[day-1].theme} day ${day}`);
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=3&q=${query}&type=video&key=${YOUTUBE_API_KEY}`;
            
            try {
                const data = await fetchWithRetry(url);
                state.dayVideos[day] = data.items;
            } catch (e) {
                console.error(e);
            } finally {
                state.isFetchingVideos = false;
                render();
            }
        }

        function generateRoadmapData() {
            const themes = ["Foundations", "Analysis", "Practical Application", "Global Standards", "Mock Strategy"];
            state.roadmapData = [];
            for (let i = 1; i <= state.profile.totalDays; i++) {
                state.roadmapData.push({
                    day: i,
                    theme: themes[Math.floor((i-1)/(state.profile.totalDays/themes.length)) % themes.length],
                    topic: `Module ${i}: ${state.profile.targetExam} Advanced Theory`
                });
            }
            state.currentView = 'roadmap';
            fetchYouTubeVideos(1);
            render();
        }

        // --- Render Views ---

        function render() {
            const viewport = document.getElementById('viewport');
            const navItems = document.getElementById('nav-items');

            navItems.innerHTML = navConfig.map(item => `

                    <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                    <span class="font-medium">${item.label}</span>
                </button>
            `).join('');

            // Render View Content
            let content = '';
            switch(state.currentView) {
                case 'dashboard':
                    content = `

                                <div>
                                    <h1 class="text-2xl font-bold text-slate-800">Academic Hub</h1>
                                    <p class="text-slate-500 text-sm">Welcome to Rithiksha AI Ecosystem</p>
                                </div>
                                <button onclick="navigateTo('ai')" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold shadow-lg shadow-indigo-100 flex items-center space-x-2">
                                    <i data-lucide="sparkles" class="w-4 h-4"></i> <span>Open AI Assistant</span>
                                </button>
                            </header>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                                    <div class="bg-indigo-600 w-10 h-10 rounded-xl flex items-center justify-center text-white mb-4"><i data-lucide="brain-circuit"></i></div>
                                    <h3 class="font-bold">Rithiksha AI</h3>
                                    <p class="text-xs text-slate-500 mt-2">Personalized study architect.</p>
                                </div>
                                <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                                    <div class="bg-blue-500 w-10 h-10 rounded-xl flex items-center justify-center text-white mb-4"><i data-lucide="book-open"></i></div>
                                    <h3 class="font-bold">Textbook Helper</h3>
                                    <p class="text-xs text-slate-500 mt-2">Summarize literary sources.</p>
                                </div>
                                <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                                    <div class="bg-purple-500 w-10 h-10 rounded-xl flex items-center justify-center text-white mb-4"><i data-lucide="zap"></i></div>
                                    <h3 class="font-bold">Vidya AI Path</h3>
                                    <p class="text-xs text-slate-500 mt-2">Curated video roadmaps.</p>
                                </div>
                                <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                                    <div class="bg-emerald-500 w-10 h-10 rounded-xl flex items-center justify-center text-white mb-4"><i data-lucide="graduation-cap"></i></div>
                                    <h3 class="font-bold">CBSNU Exams</h3>
                                    <p class="text-xs text-slate-500 mt-2">Exam portal & certification.</p>
                                </div>
                            </div>
                        </div>
                    `;
                    break;

                case 'ai':
                    if (state.showSummary) {
                        content = `
                            <div class="max-w-2xl mx-auto space-y-6 fade-in print-area">
                                <div class="bg-white border-2 border-slate-100 rounded-[2.5rem] overflow-hidden shadow-2xl">
                                    <div class="bg-indigo-600 p-8 text-white">
                                        <h2 class="text-2xl font-black">Academic Blueprint</h2>
                                        <p class="text-indigo-100 text-xs font-bold uppercase tracking-widest">${state.profile.totalDays} Days until Attempt</p>
                                    </div>
                                    <div class="p-8 space-y-6">

                                        <div class="pt-4 space-y-3 print-hidden">

                                            <button onclick="window.print()" class="w-full bg-slate-50 text-slate-600 py-3 rounded-xl font-bold flex justify-center items-center space-x-2"><i data-lucide="printer" class="w-4 h-4"></i><span>Print Report</span></button>

                    } else {
                        content = `

                                    <div class="bg-indigo-600 p-2 rounded-xl text-white"><i data-lucide="sparkles"></i></div>
                                    <div><h2 class="font-bold">Rithiksha AI Assistant</h2><p class="text-xs text-emerald-500 font-bold uppercase tracking-widest">Architect Mode Active</p></div>
                                </div>

                                    ${state.messages.map(m => `
                                        <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">

                                                <p class="text-sm">${m.content}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                    ${state.onboardingStep === 5 ? `
                                        <div class="flex space-x-2">
                                            <button onclick="handleOnboarding('Working Professional')" class="bg-white border border-slate-200 px-4 py-2 rounded-xl text-sm font-bold text-slate-700 hover:bg-indigo-50">Working Professional</button>

                                <div class="p-6 bg-white rounded-b-3xl border border-slate-100 flex space-x-2">

                    break;

                case 'roadmap':
                    const currentVideos = state.dayVideos[state.selectedDay] || [];
                    content = `
                        <div class="space-y-6 fade-in pb-20">

                                <h2 class="text-3xl font-black text-slate-900">${state.profile.targetExam} Strategy</h2>
                                <p class="text-slate-500 font-medium">${state.profile.totalDays}-Day Syllabus Distribution</p>
                            </header>

                            <div class="bg-white border border-slate-100 p-4 rounded-3xl overflow-hidden shadow-sm">
                                <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-hide">
                                    ${state.roadmapData.map(d => `
                                        <button onclick="state.selectedDay = ${d.day}; fetchYouTubeVideos(${d.day});" class="shrink-0 w-12 h-12 rounded-xl text-xs font-black border transition-all ${state.selectedDay === d.day ? 'bg-indigo-600 border-indigo-600 text-white scale-110 shadow-lg' : 'bg-slate-50 border-transparent text-slate-400'}">${d.day}</button>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div class="lg:col-span-1 bg-white p-8 rounded-[2.5rem] border border-slate-100">
                                    <h3 class="font-bold text-slate-800 mb-6">Day ${state.selectedDay} Agenda</h3>
                                    <div class="space-y-6">
                                        <div class="flex space-x-3">
                                            <div class="w-1 h-12 bg-indigo-600 rounded-full"></div>
                                            <div><p class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">Morning Slot</p><p class="text-sm font-bold text-slate-700">${state.roadmapData[state.selectedDay-1].theme}</p></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="lg:col-span-2 space-y-6">
                                    <div class="bg-black aspect-video rounded-[2.5rem] overflow-hidden shadow-2xl relative">
                                        ${state.isFetchingVideos ? '<div class="w-full h-full flex items-center justify-center text-white font-bold animate-pulse">Accessing YouTube API...</div>' : 
                                          (currentVideos.length > 0 ? `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${currentVideos[0].id.videoId}" frameborder="0" allowfullscreen></iframe>` : '<div class="text-white flex items-center justify-center h-full">Select a day to load lessons</div>')}
                                    </div>
                                    <div class="bg-white p-6 rounded-3xl border border-slate-100">
                                        <h3 class="font-bold mb-4">Lesson Recommendations</h3>
                                        <div class="space-y-3">
                                            ${currentVideos.map(v => `
                                                <div class="flex items-center space-x-4 p-4 bg-slate-50 rounded-2xl cursor-pointer hover:bg-indigo-50 border border-transparent hover:border-indigo-100 transition-all">
                                                    <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-rose-600"><i data-lucide="youtube"></i></div>
                                                    <div><h4 class="text-sm font-bold truncate max-w-md">${v.snippet.title}</h4><p class="text-[10px] text-slate-400 font-bold uppercase">${v.snippet.channelTitle}</p></div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    break;

                default:
                    content = '<div class="p-20 text-center">Page under construction...</div>';
            }

            viewport.innerHTML = content;
            lucide.createIcons();
            
            // Auto-scroll chat
            const chat = document.getElementById('chat-container');
            if (chat) chat.scrollTop = chat.scrollHeight;
        }

        // --- Initialization ---
        window.onload = () => {
            render();
        };

    </script>
</body>
</html>
