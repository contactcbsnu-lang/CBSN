        }

            0%, 100% { height: 8px; }
            50% { height: 24px; }
        }
        .wave-bar { animation: pulseWave 1.2s ease-in-out infinite; }
    </style>

        // Exponential backoff fetch function
        async function fetchWithRetry(url, options = {}, retries = 5) {
            let delay = 1000;
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return await response.json();
                } catch (e) {
                    if (i === retries - 1) throw e;
                }
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }
            throw new Error("Target API Connection Failed.");
        }

        // --- Real-time Notes Synced Trigger ---
        function saveRealtimeNotes() {

                state.freeNotesToday--;
                triggerNotification("Notes Saved", "Real-time notes successfully synced with video timestamp.");
            } else {

        // --- Feasibility Calculation & Form Processing ---
        function calculateAge(dob) {
            if (!dob) return null;
            const diff = Date.now() - new Date(dob).getTime();
            const ageDate = new Date(diff);
            return Math.abs(ageDate.getUTCFullYear() - 1970);
        }

        function calculateDays(target) {
            const today = new Date();
            const examDate = new Date(target);
            const diffTime = Math.abs(examDate - today);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // --- Gemini Integration for Real-world Feasibility Check ---
        async function processFeasibilityForm(e) {
            e.preventDefault();
            const name = document.getElementById('form-name').value;
            const dob = document.getElementById('form-dob').value;
            const qualification = document.getElementById('form-qualification').value;
            const targetExam = document.getElementById('form-exam').value;
            const status = document.getElementById('form-status').value;
            const hours = parseInt(document.getElementById('form-hours').value) || 0;
            const attemptDate = document.getElementById('form-attempt-date').value;

            if (!name || !dob || !qualification || !attemptDate || !hours) {
                triggerNotification("Missing Fields", "Kripya form ki sari jankari bharein.");
                return;
            }

            const totalDays = calculateDays(attemptDate);
            const calculatedAge = calculateAge(dob);

            state.loadingAI = true;
            render();

            // Structuring complex system prompt for evaluation
            const systemPrompt = `You are the primary cognitive architect of Rithiksha AI Educational Ecosystem. 
            You evaluate whether a student's preparation schedule is possible.
            You must verify the eligibility metrics and provide deep syllabus phases.
            All your explanations, reasons, and recommendations must be in Hinglish (Hindi written in Latin script).
            All mathematical/scientific equations or values must be formatted using LaTeX-style syntax like $X$ or $$Y$$.
            You must return strictly valid JSON matching the exact schema specified in the request. No markdown wrappers.`;

            const userQuery = `Evaluate the feasibility of preparation for ${targetExam} with:
            Name: ${name}
            DOB: ${dob} (Age: ${calculatedAge})
            Qualification: ${qualification}
            Status: ${status}
            Daily Study Hours: ${hours} hours
            Days until Exam: ${totalDays} days.
            Return a JSON object conforming exactly to this structure:
            {
              "feasibilityStatus": "YES" or "NO",
              "reason": "Clear analytical reason in Hinglish explaining syllabus load versus time constraint using math equations where appropriate.",
              "recommendation": "Detailed study guidance in Hinglish suggesting exactly how much study hours or days are required if not feasible.",
              "phases": [
                {
                  "phaseName": "Phase Title",
                  "daysRange": "Day X to Y",
                  "focusTopics": ["Topic 1", "Topic 2", "Topic 3"]
                }
              ]
            }
            Generate exactly 5 phases across the ${totalDays} days. Fill up all of them.`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            feasibilityStatus: { type: "STRING" },
                            reason: { type: "STRING" },
                            recommendation: { type: "STRING" },
                            phases: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        phaseName: { type: "STRING" },
                                        daysRange: { type: "STRING" },
                                        focusTopics: {
                                            type: "ARRAY",
                                            items: { type: "STRING" }
                                        }
                                    },
                                    required: ["phaseName", "daysRange", "focusTopics"]
                                }
                            }
                        },
                        required: ["feasibilityStatus", "reason", "recommendation", "phases"]
                    }
                }
            };

            try {
                const data = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const parsedAI = JSON.parse(data.candidates[0].content.parts[0].text);
                
                state.profile = {
                    name,
                    dob,
                    age: calculatedAge,
                    qualification,
                    targetExam,
                    status,
                    hours,
                    attemptDate,
                    totalDays,
                    isVerified: true,
                    feasibilityStatus: parsedAI.feasibilityStatus,
                    aiDiagnosisReason: parsedAI.reason,
                    aiDiagnosisRecommendation: parsedAI.recommendation,
                    aiSyllabusPhases: parsedAI.phases
                };

                if (parsedAI.feasibilityStatus === 'YES') {
                    triggerNotification("Feasibility Confirmed", "AI ne aapka schedule verify kar liya hai! Syllabus dynamically mapping complete.");
                    buildDynamicRoadmapData();
                } else {
                    triggerNotification("Timeline Alert", "Syllabus cover karne ke liye risk hai. Support lead has been forwarded.");
                    const supportLead = {
                        id: Math.floor(Math.random() * 9000) + 1000,
                        student: name,
                        exam: targetExam,
                        timeLogged: new Date().toLocaleTimeString(),
                        reason: `AI Diagnostic Warning: ${parsedAI.reason.substring(0, 100)}...`
                    };
                    state.supportLeadsGenerated.unshift(supportLead);
                }

            } catch (error) {
                console.error("AI Error:", error);
                // Graceful fallback to maintain zero failure rate
                const localFeasible = (totalDays * hours) >= 300 ? 'YES' : 'NO';
                state.profile = {
                    name, dob, age: calculatedAge, qualification, targetExam, status, hours, attemptDate, totalDays,
                    isVerified: true,
                    feasibilityStatus: localFeasible,
                    aiDiagnosisReason: "Mathematical check: Available Study Window is sufficient for conceptual revisions.",
                    aiDiagnosisRecommendation: "Spend at least $3$ hours daily focusing on high-weightage topics first.",
                    aiSyllabusPhases: [
                        { phaseName: "Foundational Phase", daysRange: `1 to ${Math.floor(totalDays*0.2)}`, focusTopics: ["Basic Introduction", "Structural Frameworks"] },
                        { phaseName: "Analytical Deep Dive", daysRange: `${Math.floor(totalDays*0.2) + 1} to ${Math.floor(totalDays*0.5)}`, focusTopics: ["Core Complex Principles", "In-Depth Formula Practice"] },
                        { phaseName: "Syllabus Core Execution", daysRange: `${Math.floor(totalDays*0.5) + 1} to ${Math.floor(totalDays*0.75)}`, focusTopics: ["Advanced Theory", "Doubt Clearing"] },
                        { phaseName: "Cross Border Evaluation", daysRange: `${Math.floor(totalDays*0.75) + 1} to ${Math.floor(totalDays*0.9)}`, focusTopics: ["Practice Exams", "CBSNU Integration"] },
                        { phaseName: "Sustained Revision Phase", daysRange: `${Math.floor(totalDays*0.9) + 1} to ${totalDays}`, focusTopics: ["Quick Formula Updates", "Final Mock Tests"] }
                    ]
                };
                if (localFeasible === 'YES') {
                    buildDynamicRoadmapData();
                }
            } finally {
                state.loadingAI = false;
                render();
            }
        }

        // Mapping Gemini AI phases and utilizing daily study hour blocks 
        function buildDynamicRoadmapData() {
            state.roadmap = [];
            const totalHours = parseInt(state.profile.hours) || 2;
            const phases = state.profile.aiSyllabusPhases;

            for (let i = 1; i <= state.profile.totalDays; i++) {
                // Find active phase based on current day index
                let currentPhase = phases[0];
                for (let p of phases) {
                    const rangeParts = p.daysRange.split(' to ');
                    const start = parseInt(rangeParts[0]) || 1;
                    const end = parseInt(rangeParts[1]) || state.profile.totalDays;
                    if (i >= start && i <= end) {
                        currentPhase = p;
                        break;
                    }
                }

                const daySchedule = [];
                const topicsAvailable = currentPhase.focusTopics;
                
                // Distribute daily hours dynamically
                for (let h = 1; h <= totalHours; h++) {
                    const topicIndex = (i + h) % topicsAvailable.length;
                    const activeTopic = topicsAvailable[topicIndex];
                    let task = "";
                    
                    if (h === 1) task = `Vidya AI Video Lecture: Conceptual mastery on ${activeTopic}`;
                    else if (h === 2) task = `The Textbook Helper: Summarize and translate reference materials for ${activeTopic}`;
                    else if (h === totalHours) task = `Rithiksha AI: Summary analysis & conceptual evaluation on ${activeTopic}`;
                    else task = `Deep-dive problem sets & structural revisions for ${activeTopic}`;

                    daySchedule.push({ hour: h, task, topic: activeTopic });
                }

                state.roadmap.push({
                    day: i,
                    theme: currentPhase.phaseName,
                    topic: `Milestone: ${currentPhase.phaseName} - Day ${i}`,
                    schedule: daySchedule
                });
            }
            getVideos(1);
        }

        async function getVideos(day) {
            state.loadingVideos = true;
            render();

            const currentDay = state.roadmap[day - 1];
            if (!currentDay) return;
            const activeTopic = currentDay.schedule[0]?.topic || state.profile.targetExam;

            const query = encodeURIComponent(`${state.profile.targetExam} ${activeTopic} detailed standard lecture`);
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=4&q=${query}&type=video&key=${YOUTUBE_API_KEY}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                state.videoCache[day] = data.items || [];
                if (data.items && data.items.length > 0) {
                    state.activeVideoId = data.items[0].id.videoId;
                    state.studyVideoUrl = `https://www.youtube.com/embed/${state.activeVideoId}`;
                }
            } catch (e) {
                console.error("YouTube Fetch Error:", e);
            } finally {
                state.loadingVideos = false;
                render();
            }
        }

        function resetBlueprintForm() {
            state.profile.isVerified = false;
            state.profile.feasibilityStatus = null;
            render();
        }

        function forceUnlockPlan() {
            state.profile.feasibilityStatus = 'YES';
            buildDynamicRoadmapData();

                                    <p class="text-[10px] text-slate-500 mt-2">Offers CBSNU exam alignment batches</p>
                                </div>
                                <button class="px-4 py-2 bg-slate-900 text-slate-300 text-xs font-bold rounded-xl hover:bg-slate-850" onclick="triggerNotification('Contact Shared', 'Home tutor details sent to registered mail.')">Connect</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- VIEW 5: Evaluations (Mocks & Scholarship attempts) ---
            else if (state.view === 'evaluation') {
                html = `
                    <div class="animate-up space-y-8 pb-20">
                        <div class="text-center max-w-2xl mx-auto space-y-3">
                            <span class="bg-emerald-950 border border-emerald-900 text-emerald-400 text-[10px] px-3.5 py-1.5 rounded-full font-black uppercase tracking-widest">Mock & Scholars Assessments</span>
                            <h2 class="text-3xl font-black text-slate-100 font-outfit">Syllabus Evaluation Hub</h2>
                            <p class="text-slate-400 text-sm">Attempt mock papers structured directly with Rithiksha AI curriculum milestones.</p>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <!-- Mock attempt card -->
                            <div class="bg-slate-950 border border-slate-900 p-8 rounded-[2.5rem] flex flex-col justify-between">
                                <div>
                                    <div class="w-12 h-12 bg-indigo-950/40 text-indigo-400 border border-indigo-900/40 rounded-2xl flex items-center justify-center mb-6"><i data-lucide="file-edit"></i></div>
                                    <h3 class="text-lg font-black text-slate-200">Interactive Mock Test</h3>
                                    <p class="text-xs text-slate-400 mt-2">Assess your readiness. Costs **100 Coins** to generate an adaptive evaluation paper corresponding to your active study days.</p>
                                </div>
                                <button onclick="if(payCoins(100, 'Mock Test Generation')) { triggerNotification('Generating Mock', 'Mock test created successfully!'); }" class="w-full mt-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black uppercase rounded-xl transition-all shadow-lg glow-indigo">Generate Mock Test</button>
                            </div>

                            <!-- Annual Scholarship Test -->
                            <div class="bg-slate-950 border border-slate-900 p-8 rounded-[2.5rem] flex flex-col justify-between">
                                <div>
                                    <div class="w-12 h-12 bg-amber-950/40 text-amber-400 border border-amber-900/40 rounded-2xl flex items-center justify-center mb-6"><i data-lucide="award"></i></div>
                                    <h3 class="text-lg font-black text-slate-200">CBSNU Scholarship Examination</h3>
                                    <p class="text-xs text-slate-400 mt-2">1 attempt per year is completely free. Subsequent exam fee requires **1000 Coins** deduct.</p>
                                </div>
                                <button onclick="triggerNotification('Free Scholarship Test Started', 'Welcome to CBSNU Annual Scholarship Test. Best of luck!')" class="w-full mt-8 py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-900 text-xs font-black uppercase rounded-xl transition-all">Start Annual Free Attempt</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- VIEW 6: Weekly Assessments (Cohort competition) ---
            else if (state.view === 'weekly-test') {
                html = `
                    <div class="animate-up space-y-8 pb-20">
                        <div class="text-center max-w-2xl mx-auto space-y-3">
                            <span class="bg-purple-950 border border-purple-900 text-purple-300 text-[10px] px-3.5 py-1.5 rounded-full font-black uppercase tracking-widest">Global Study Cohorts</span>
                            <h2 class="text-3xl font-black text-slate-100 font-outfit">Anonymized Live Assessment Rankings</h2>
                            <p class="text-slate-400 text-sm">Fostering healthy completion without peer data leakage or private interactions.</p>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2 space-y-6">
                                <div class="bg-slate-950 border border-slate-900 p-8 rounded-[2.5rem]">
                                    <h3 class="font-black text-slate-100 mb-6 flex items-center"><i data-lucide="trophy" class="text-amber-500 mr-2"></i> Rank Table</h3>
                                    <div class="space-y-3">
                                        ${state.leaderboard.map((u, i) => `
                                            <div class="flex items-center justify-between p-4 bg-slate-900/60 border border-slate-850 rounded-2xl">
                                                <div class="flex items-center space-x-4">
                                                    <span class="text-xs font-black text-slate-500">#${u.rank}</span>
                                                    <span class="text-xs font-bold text-slate-300">${u.name}</span>
                                                </div>
                                                <div class="flex items-center space-x-6">
                                                    <span class="text-xs font-bold text-indigo-400">${u.speed} Pace</span>
                                                    <span class="text-xs font-black text-slate-200">${u.points} pts</span>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- VIEW 7: Administrative Support Logs / Consistency Leads ---
            else if (state.view === 'admin-support') {
                html = `
                    <div class="animate-up space-y-8 pb-20">
                        <div class="text-center max-w-2xl mx-auto space-y-3">
                            <span class="bg-red-950 border border-red-900 text-red-400 text-[10px] px-3.5 py-1.5 rounded-full font-black uppercase tracking-widest">Consistency Support Log (Backend Lead Engine)</span>
                            <h2 class="text-3xl font-black text-slate-100 font-outfit">AI Consistency Reports & Support Leads</h2>
                            <p class="text-slate-400 text-sm">When AI Attention Monitor tracks consistency drops or unfeasible timelines, it routes automatic lead notifications to customer care for motivational counseling.</p>
                        </div>

                        <div class="bg-slate-950 border border-slate-900 p-8 rounded-[2.5rem] card-shadow">
                            <h3 class="font-black text-slate-200 mb-6">Generated Student Support Leads</h3>
                            <div class="space-y-4">
                                ${state.supportLeadsGenerated.length > 0 ? state.supportLeadsGenerated.map(l => `
                                    <div class="flex items-center justify-between p-4 bg-slate-900 border border-slate-800 rounded-2xl">
                                        <div class="flex items-center space-x-3">
                                            <div class="bg-rose-500/20 p-2 rounded-xl text-rose-400"><i data-lucide="alert-circle"></i></div>
                                            <div>
                                                <h4 class="text-xs font-bold text-slate-200">Lead: #${l.id}</h4>
                                                <p class="text-[10px] text-slate-400">${l.reason}</p>
                                                <p class="text-[10px] text-slate-500">Student: ${l.student} • Target: ${l.exam} • Logged at: ${l.timeLogged}</p>
                                            </div>
                                        </div>
                                        <button onclick="triggerNotification('Call Assigned', 'Motivational session allocated to counseling executive.');" class="px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-lg hover:bg-indigo-700">Assign Call</button>
                                    </div>
                                `).join('') : '<p class="text-center py-10 text-slate-500 text-xs font-bold uppercase tracking-widest">No attention drops or critical timeline risks recorded.</p>'}
                            </div>
                        </div>
                    </div>
                `;
            }

            main.innerHTML = html;
            lucide.createIcons();
        }

        window.onload = () => {
            render();
            // Monitor Active Window Focus for Attention Index
            window.addEventListener('blur', () => {
                if (state.view === 'study-bar' && state.profile.isVerified && state.profile.feasibilityStatus === 'YES') {
                    simulateIdleState();
                }
            });
            triggerNotification("Rithiksha Ecosystem Live", "Democratic Study and Verification systems are active.");
        };
    </script>
</body>
</html>
